name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pty, picture, config, theme]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          seeds=seeds/${{ matrix.target }}
          [ ${{ matrix.target }} = theme ] && seeds=../assets/themes
          cargo fuzz run -O ${{ matrix.target }} corpus/${{ matrix.target }} $seeds -- -max_total_time=300 -max_len=65536 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts
