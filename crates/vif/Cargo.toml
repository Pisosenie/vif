[package]
name = "vif"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vif-config.workspace = true
vif-render.workspace = true
alacritty_terminal.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
notify.workspace = true
open.workspace = true
log.workspace = true
libc = "0.2"
env_logger.workspace = true
copypasta = "0.10"
base64 = "0.22"
png = "0.18"
memchr = "2"
flate2 = "1"
polling = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit.workspace = true
zune-jpeg = "0.5.15"
gif = "0.14.2"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.9"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
